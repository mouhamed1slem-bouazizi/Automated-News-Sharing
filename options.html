<!DOCTYPE html>
<html>
<head>
  <title>RSS to X Poster - Settings</title>
  <link rel="stylesheet" href="css/options.css">
</head>
<body>
  <div class="container">
    <h1>RSS to X Poster Settings</h1>
    
    <div class="settings-section">
      <h2>API Keys</h2>
      <div class="form-group">
        <label for="openaiKey">OpenAI API Key</label>
        <input type="password" id="openaiKey" placeholder="sk-...">
      </div>
      <div class="form-group">
        <label for="twitterKey">Twitter API Key</label>
        <input type="password" id="twitterKey" placeholder="Enter your Twitter API key">
      </div>
    </div>
    
    <div class="settings-section">
      <h2>Posting Settings</h2>
      <div class="form-group">
        <label for="autoPostingEnabled">Auto-posting</label>
        <label class="toggle-switch">
          <input type="checkbox" id="autoPostingEnabled">
          <span class="slider round"></span>
        </label>
      </div>
      <div class="form-group">
        <label for="previewBeforePosting">Preview before posting</label>
        <label class="toggle-switch">
          <input type="checkbox" id="previewBeforePosting">
          <span class="slider round"></span>
        </label>
      </div>
      <div class="form-group">
        <label for="postingInterval">Minimum time between posts (minutes)</label>
        <input type="number" id="postingInterval" min="15" max="1440">
      </div>
    </div>
    
    <div class="settings-section">
      <h2>Summary Settings</h2>
      <div class="form-group">
        <label for="summaryLength">Summary length</label>
        <select id="summaryLength">
          <option value="short">Short (1-2 sentences)</option>
          <option value="medium">Medium (2-3 sentences)</option>
          <option value="long">Long (4-5 sentences)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="includeHashtags">Include hashtags</label>
        <label class="toggle-switch">
          <input type="checkbox" id="includeHashtags">
          <span class="slider round"></span>
        </label>
      </div>
      <div class="form-group">
        <label for="hashtags">Hashtags (comma separated)</label>
        <input type="text" id="hashtags" placeholder="news, update">
      </div>
    </div>
    
    <div class="settings-section">
      <h2>RSS Feeds</h2>
      <div id="feedsList" class="feeds-list">
        <!-- Feeds will be inserted here -->
      </div>
      <div class="form-group add-feed">
        <input type="text" id="newFeedUrl" placeholder="Enter RSS feed URL">
        <button id="addFeedBtn" class="btn primary">Add Feed</button>
      </div>
    </div>
    
    <div class="button-row">
      <button id="saveBtn" class="btn primary">Save Settings</button>
      <button id="resetBtn" class="btn">Reset</button>
    </div>
  </div>
  
  <script src="js/storage-service.js"></script>
  <script src="options.js"></script>
</body>
</html>
